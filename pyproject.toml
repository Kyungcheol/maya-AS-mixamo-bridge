[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maya-as-mixamo-bridge"
version = "0.1.0"
description = "Validated HumanIK bridge between studio Mixamo and AdvancedSkeleton rigs"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
as_mixamo_bridge = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore:invalid escape sequence.*:DeprecationWarning",
]
